<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowMe!</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#171923}main{max-width:720px;margin:auto;padding:30px 16px}.card{background:white;padding:20px;border-radius:18px;margin:15px 0;border:1px solid #e4e5ec}h1{font-size:42px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#6558f5;color:white;font-weight:800;font-size:16px;margin:5px 0}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #ccc;border-radius:9px;margin:6px 0 12px}.choice{display:block;padding:12px;border:1px solid #ddd;border-radius:9px;margin:8px 0}.choice input{width:auto;margin:0 8px 0 0}.muted{color:#687086}.score{font-size:54px;font-weight:900;color:#6558f5;text-align:center}</style></head>
<body><main id="app"></main><script>
const A=document.getElementById("app"),demo={id:"demo",title:"Quick KnowMe! Challenge",creator:"KnowMe!",q:[["Which season follows spring?",["Winter","Summer","Fall","Spring"],1],["Which animal usually barks?",["Dog","Fish","Turtle","Butterfly"],0],["What tells time?",["Clock","Plate","Shoe","Pillow"],0],["Blue plus yellow makes?",["Orange","Purple","Green","Red"],2],["Days in a week?",["5","6","7","8"],2]]};
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function home(){A.innerHTML=`<div style="text-align:center;padding:40px 0"><h1>Who really knows you best?</h1><p class="muted">Create a challenge. Share it. See who knows you best.</p><button onclick="create()">Create My Challenge</button><button onclick="play('demo')">Play Demo</button></div>`}
function create(){let x="";for(let i=0;i<5;i++)x+=`<div class="card q"><b>Question ${i+1}</b><input class="qt" placeholder="Question"><input class="a" placeholder="Answer A"><input class="a" placeholder="Answer B"><input class="a" placeholder="Answer C"><input class="a" placeholder="Answer D"><label>Correct answer <select class="c"><option value=0>A</option><option value=1>B</option><option value=2>C</option><option value=3>D</option></select></label></div>`;A.innerHTML=`<h1>Create your challenge</h1><p class="muted">Keep it fun. Never include passwords, addresses, phone numbers, school details, or private information.</p><div class="card"><input id="creator" placeholder="Your display name"><input id="title" placeholder="Challenge title"></div>${x}<button onclick="publish()">Publish</button>`}
function publish(){let cr=creator.value.trim(),ti=title.value.trim();if(!cr||!ti)return alert("Add your name and title.");let q=[];for(const e of document.querySelectorAll(".q")){let t=e.querySelector(".qt").value.trim(),a=[...e.querySelectorAll(".a")].map(x=>x.value.trim());if(!t||a.some(x=>!x))return alert("Complete all five questions.");q.push([t,a,+e.querySelector(".c").value])}let id=Date.now().toString(36),d=JSON.parse(localStorage.km||"{}");d[id]={id,title:ti,creator:cr,q};localStorage.km=JSON.stringify(d);share(id)}
function get(id){return id==="demo"?demo:JSON.parse(localStorage.km||"{}")[id]}
function share(id){let c=get(id);if(!c)return missing();let u=location.href.split("#")[0]+"#play/"+id;A.innerHTML=`<div class="card"><h1>Challenge ready!</h1><h2>${esc(c.title)}</h2><p>By ${esc(c.creator)}</p><input value="${esc(u)}" readonly><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${u}');alert('Link copied')">Copy Link</button><button onclick="play('${id}')">Play</button></div>`}
function play(id){let c=get(id);if(!c)return missing();location.hash="play/"+id;A.innerHTML=`<h1>${esc(c.title)}</h1><p>By ${esc(c.creator)}</p><div class="card"><input id="name" placeholder="Your display name"></div>`+c.q.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((x,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"><b>${String.fromCharCode(65+j)}.</b> ${esc(x)}</label>`).join("")}</div>`).join("")+`<button onclick="finish('${id}')">See My Score</button>`}
function finish(id){let c=get(id),playerInput=document.getElementById("name"),n=playerInput?playerInput.value.trim():"";if(!n)return alert("Enter your name.");let s=0;for(let i=0;i<c.q.length;i++){let x=document.querySelector('input[name="q'+i+'"]:checked');if(!x)return alert("Answer every question.");if(+x.value===c.q[i][2])s++}let k="scores_"+id,a=JSON.parse(localStorage.getItem(k)||"[]");a.push({n,s,t:Date.now()});a.sort((x,y)=>y.s-x.s||x.t-y.t);localStorage.setItem(k,JSON.stringify(a));A.innerHTML=`<div class="card"><div class="score">${s}/${c.q.length}</div><h2 style="text-align:center">${Math.round(s/c.q.length*100)}%</h2><button onclick="share('${id}')">Challenge Your Friends</button><button onclick="create()">Create Your Own</button></div><div class="card"><h2>Leaderboard</h2>${a.slice(0,10).map((x,i)=>`<p><b>${i+1}. ${esc(x.n)}</b> — ${x.s}/${c.q.length}</p>`).join("")}</div>`}
function missing(){A.innerHTML='<div class="card"><h1>Challenge not found</h1><p>This prototype stores created challenges on the device that created them.</p><button onclick="home()">Home</button></div>'}
function route(){let p=location.hash.slice(1).split("/");p[0]==="play"&&p[1]?play(p[1]):home()}addEventListener("hashchange",route);route();
</script></body></html>
