<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowMe!</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f6f7fb;color:#171923}main{max-width:720px;margin:auto;padding:28px 16px 70px}.card{background:#fff;padding:20px;border-radius:18px;margin:15px 0;border:1px solid #e4e5ec}h1{font-size:clamp(34px,8vw,48px)}button{width:100%;padding:14px;border:0;border-radius:12px;background:#6558f5;color:#fff;font-weight:800;font-size:16px;margin:6px 0}button.alt{background:#eceafd;color:#4037b7}input,select{width:100%;padding:12px;border:1px solid #cfd2dc;border-radius:9px;margin:6px 0 12px;font-size:16px}.muted{color:#687086}.qhead{font-size:19px;font-weight:850}.ans{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;margin:9px 0 9px 20px}.ans input{margin:0}.letter{font-weight:900;font-size:18px;color:#4c43c7;text-align:center}.pick{padding:12px;border:1px solid #ddd;border-radius:10px}.pick input{width:auto;margin:0 8px 0 0}.score{text-align:center;font-size:58px;font-weight:950;color:#6558f5}.notice{background:#fff8e6;padding:12px;border-radius:10px}.tmpl{padding:12px 0;border-bottom:1px solid #eee}</style></head>
<body><main id="app"></main><script>
const A=document.getElementById("app"),L=["A","B","C","D"],E=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function encode(c){let bytes=new TextEncoder().encode(JSON.stringify(c)),bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decode(x){try{x=x.replace(/-/g,"+").replace(/_/g,"/");while(x.length%4)x+="=";let bin=atob(x),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch(e){return null}}
const demo={creator:"KnowMe!",title:"Quick KnowMe! Challenge",q:[["Which season follows spring?",["Winter","Summer","Fall","Spring"],1],["Which animal usually barks?",["Dog","Fish","Turtle","Butterfly"],0],["What tells time?",["Clock","Plate","Shoe","Pillow"],0],["Blue plus yellow makes?",["Orange","Purple","Green","Red"],2],["Days in a week?",["5","6","7","8"],2]]};
function home(){let t=load("km_templates",[]);A.innerHTML=`<div style="text-align:center;padding:28px 0"><h1>Who really knows you best?</h1><p class="muted">Create a challenge. Share it. See who knows you best.</p><button onclick="create()">Create My Challenge</button><button class="alt" onclick='play(${JSON.stringify(demo)})'>Play Demo</button></div>${t.length?`<div class="card"><h2>My Saved Templates</h2>${t.map((x,i)=>`<div class="tmpl"><b>${E(x.title)}</b><br><span class="muted">${E(x.creator)}</span><button class="alt" onclick="reuse(${i})">Reuse / Edit</button></div>`).join("")}</div>`:""}`}
function qe(i,v){v=v||["",["","","",""],0];return `<div class="card q"><div class="qhead">Question ${i+1}</div><input class="qt" value="${E(v[0])}" placeholder="Question">${v[1].map((x,j)=>`<div class="ans"><span class="letter">${L[j]}.</span><input class="av" value="${E(x)}" placeholder="Answer ${L[j]}"></div>`).join("")}<label>Correct answer</label><select class="correct">${L.map((x,j)=>`<option value="${j}" ${j==v[2]?"selected":""}>${x}</option>`).join("")}</select></div>`}
function create(p){p=p||{creator:"",title:"",q:Array.from({length:5},()=>["",["","","",""],0])};A.innerHTML=`<h1>Create your challenge</h1><p class="notice">Keep it fun. Don't include passwords, addresses, phone numbers, school details, or other private information.</p><div class="card"><input id="creator" value="${E(p.creator)}" placeholder="Your display name"><input id="title" value="${E(p.title)}" placeholder="Challenge title"></div>${p.q.map((x,i)=>qe(i,x)).join("")}<button onclick="publish()">Save & Publish</button>`}
function reuse(i){let t=load("km_templates",[])[i];if(t)create(t)}
function publish(){let cr=document.getElementById("creator").value.trim(),ti=document.getElementById("title").value.trim();if(!cr||!ti)return alert("Add your name and title.");let q=[];for(let e of document.querySelectorAll(".q")){let qt=e.querySelector(".qt").value.trim(),av=[...e.querySelectorAll(".av")].map(x=>x.value.trim());if(!qt||av.some(x=>!x))return alert("Complete every question and all four answers.");q.push([qt,av,+e.querySelector(".correct").value])}let c={creator:cr,title:ti,q},t=load("km_templates",[]);t.unshift(c);save("km_templates",t.slice(0,20));share(c)}
function share(c){window.current=c;let url=location.href.split("#")[0]+"#play="+encode(c);A.innerHTML=`<div class="card"><h1>Challenge Ready!</h1><h2>${E(c.title)}</h2><p>By ${E(c.creator)}</p><p class="muted">This link includes your challenge so another phone can play it.</p><input id="url" readonly value="${E(url)}"><button onclick="copy()">Copy Play Link</button><button class="alt" onclick="play(window.current)">Play It Here</button><button class="alt" onclick="home()">My Templates</button></div>`}
async function copy(){let x=document.getElementById("url");try{await navigator.clipboard.writeText(x.value);alert("Play link copied!")}catch(e){x.select();document.execCommand("copy");alert("Play link copied!")}}
function play(c){window.current=c;A.innerHTML=`<h1>${E(c.title)}</h1><p>By ${E(c.creator)}</p><div class="card"><input id="player" placeholder="Your display name"></div>`+c.q.map((q,i)=>`<div class="card"><div class="qhead">${i+1}. ${E(q[0])}</div>${q[1].map((x,j)=>`<label class="ans pick"><span class="letter">${L[j]}.</span><span><input type="radio" name="q${i}" value="${j}">${E(x)}</span></label>`).join("")}</div>`).join("")+`<button onclick="finish()">See My Score</button>`}
function finish(){let c=window.current,p=document.getElementById("player"),n=p?p.value.trim():"";if(!n)return alert("Enter your display name.");let s=0;for(let i=0;i<c.q.length;i++){let x=document.querySelector('input[name="q'+i+'"]:checked');if(!x)return alert("Answer every question first.");if(+x.value===c.q[i][2])s++}A.innerHTML=`<div class="card"><div class="score">${s}/${c.q.length}</div><h2 style="text-align:center">${Math.round(s/c.q.length*100)}%</h2><button onclick="share(window.current)">Challenge Your Friends</button><button class="alt" onclick="create(window.current)">Reuse This Template</button><button class="alt" onclick="home()">Home</button></div>`}
function route(){let h=location.hash;if(h.startsWith("#play=")){let c=decode(h.slice(6));c?play(c):home()}else home()}addEventListener("hashchange",route);route();
</script></body></html>
